<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>سياق كرامات الأولياء — الإمام اللالكائي | نسخة رقمية</title>
    <meta name="description" content="سياق كرامات الأولياء من شرح أصول اعتقاد أهل السنة والجماعة للإمام أبي القاسم اللالكائي (ت 418 هـ): بحث فوري، تصفية بالفئة والموطن، مشاركة الأثر، وعمل كامل دون إنترنت.">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1b4332">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="./icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- خطوط: Amiri للنصوص والأسانيد، Cairo للعناوين والأزرار، Aref Ruqaa للزخارف -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ===== الوضع النهاري (افتراضي) — روح المخطوط الورقي ===== */
        :root {
            --bg-color: #f8f6f0;        /* ورق عتيق */
            --text-color: #2b2118;
            --card-bg: #fffdf7;
            --primary-color: #1b4332;   /* أخضر عميق */
            --gold: #d4af37;            /* لمسات ذهبية */
            --border-color: #e2d9c4;
            --header-bg: #1b4332;
            --header-text: #f5eeda;
            --badge-bg: #f3ecd9;
            --muted-color: #6f7a6a;
            --focus: #d4af37;
            --content-font-size: 1.35rem;
        }
        /* ===== الوضع الليلي ===== */
        [data-theme="dark"] {
            --bg-color: #15140f;
            --text-color: #e7e1d3;
            --card-bg: #1d1c16;
            --primary-color: #c2a15d;
            --gold: #d4af37;
            --border-color: #3a382e;
            --header-bg: #1b4332;
            --header-text: #f5eeda;
            --badge-bg: #26251d;
            --muted-color: #8fa08d;
            --focus: #ffd166;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { overflow-x: clip; scroll-behavior: smooth; }

        body {
            font-family: 'Cairo', 'Segoe UI', 'Tahoma', 'Noto Naskh Arabic', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 2;
            padding-bottom: 60px;
            overflow-x: clip;
            max-width: 100%;
            transition: background .3s, color .3s;
        }

        /* ===== الترويسة ===== */
        header {
            background-color: var(--header-bg);
            color: var(--header-text);
            padding: 2.6rem 1rem 2.2rem;
            text-align: center;
            border-bottom: 4px solid var(--gold);
            box-shadow: 0 6px 24px rgba(0,0,0,.28);
            position: relative;
        }
        header .ornament { font-family: 'Aref Ruqaa', serif; color: var(--gold); font-size: 1.6rem; opacity: .85; }
        header h1 {
            font-family: 'Cairo', sans-serif;
            font-size: clamp(1.8rem, 7vw, 2.8rem);
            font-weight: 800;
            letter-spacing: -.5px;
            margin: .35rem 0 .6rem;
        }
        header .subtitle {
            color: #bcd0c4;
            font-size: clamp(.95rem, 3.6vw, 1.2rem);
            font-weight: 500;
            max-width: 720px;
            margin: 0 auto;
        }
        header .author { color: var(--gold); font-weight: 700; }

        .container { max-width: 960px; margin: 1.6rem auto; padding: 0 1rem; }

        /* ===== لوحة التحكم والبحث ===== */
        .controls-panel {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px;
            padding: 1rem; margin-bottom: 1rem; display: flex; gap: .7rem; flex-wrap: wrap;
            align-items: center; box-shadow: 0 6px 16px rgba(0,0,0,.05);
        }
        .search-box { flex: 1; min-width: 240px; position: relative; }
        .search-box input {
            width: 100%; padding: .85rem 2.8rem .85rem 2.6rem; border: 2px solid var(--border-color);
            border-radius: 10px; background: var(--bg-color); color: var(--text-color);
            font-family: 'Cairo', sans-serif; font-size: 1.05rem;
        }
        .search-box input:focus { outline: none; border-color: var(--gold); }
        .search-box .search-icon { position: absolute; top: 50%; right: .85rem; transform: translateY(-50%); opacity: .5; pointer-events: none; }
        .search-box .search-clear {
            position: absolute; top: 50%; left: .5rem; transform: translateY(-50%);
            border: none; background: transparent; color: var(--muted-color); cursor: pointer;
            width: 2rem; height: 2rem; border-radius: 50%; font-size: 1.05rem; line-height: 1;
            display: none; align-items: center; justify-content: center;
        }
        .search-box.has-query .search-clear { display: flex; }
        .search-box .search-clear:hover { color: var(--primary-color); background: var(--badge-bg); }
        mark { background: var(--gold); color: #241c05; border-radius: 3px; padding: 0 .12em; }

        .btn {
            background: var(--primary-color); color: #fff; border: none; padding: .8rem 1.15rem;
            border-radius: 10px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: 700;
            font-size: .95rem; white-space: nowrap; transition: transform .15s, opacity .2s;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn.alt { background: var(--gold); color: #241c05; }
        .btn.ghost { background: transparent; color: var(--text-color); border: 1px solid var(--border-color); }
        .btn.ghost.active { background: var(--gold); color: #241c05; border-color: var(--gold); }
        [data-theme="dark"] .btn { color: #12100e; }
        [data-theme="dark"] .btn.ghost { color: var(--text-color); }

        .fontsize-ctrl { display: flex; gap: .35rem; }
        .fontsize-ctrl button {
            background: var(--bg-color); border: 1px solid var(--border-color); color: var(--text-color);
            width: 2.7rem; height: 2.7rem; border-radius: 10px; cursor: pointer;
            font-family: 'Cairo', sans-serif; font-weight: 700; font-size: 1rem;
        }
        .fontsize-ctrl button:hover { border-color: var(--gold); color: var(--gold); }

        /* ===== صفوف التصفية ===== */
        .filter-groups { display: flex; flex-direction: column; gap: .55rem; margin-bottom: 1.2rem; }
        .filter-row { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
        .filter-row .filter-label { font-family: 'Cairo', sans-serif; font-weight: 700; font-size: .85rem; color: var(--muted-color); margin-left: .3rem; }
        .chip {
            background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color);
            padding: .35rem .85rem; border-radius: 20px; cursor: pointer;
            font-family: 'Cairo', sans-serif; font-size: .85rem; font-weight: 600;
        }
        .chip:hover { border-color: var(--gold); }
        .chip.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
        [data-theme="dark"] .chip.active { color: #12100e; }

        /* ===== بطاقات الأثر ===== */
        .entry-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 1.6rem 1.7rem; margin-bottom: 1.4rem; box-shadow: 0 4px 16px rgba(0,0,0,.04);
            position: relative;
        }
        .entry-card::before {
            content: ""; position: absolute; top: 0; right: 1.7rem; width: 54px; height: 4px;
            background: var(--gold); border-radius: 0 0 4px 4px;
        }
        .entry-header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: .7rem; border-bottom: 2px solid var(--border-color); padding-bottom: .9rem; margin-bottom: 1.1rem; }
        .entry-title { font-family: 'Cairo', sans-serif; font-weight: 800; letter-spacing: -.5px; font-size: clamp(1.2rem, 5vw, 1.55rem); color: var(--primary-color); min-width: 0; overflow-wrap: break-word; flex: 1; }
        [data-theme="dark"] .entry-title { color: var(--gold); }
        .entry-badges { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
        .entry-badge {
            background: var(--badge-bg); color: var(--primary-color); padding: .22rem .8rem; border-radius: 20px;
            font-size: .8rem; font-weight: 700; border: 1px solid var(--border-color); white-space: nowrap;
        }
        [data-theme="dark"] .entry-badge { color: var(--gold); }
        .entry-badge.num { background: var(--gold); color: #241c05; border-color: var(--gold); }
        .entry-badge.pending { background: transparent; color: var(--muted-color); border-style: dashed; }
        .entry-actions { display: flex; align-items: center; gap: .4rem; }
        .icon-btn {
            background: transparent; border: 1px solid var(--border-color); border-radius: 50%;
            width: 2.4rem; height: 2.4rem; cursor: pointer; font-size: 1.05rem; line-height: 1;
            color: var(--primary-color); transition: background .2s;
        }
        [data-theme="dark"] .icon-btn { color: var(--gold); }
        .icon-btn:hover { border-color: var(--gold); }
        .icon-btn.saved { background: var(--gold); color: #241c05; border-color: var(--gold); }
        .entry-isnad {
            font-family: 'Amiri', serif; font-style: italic; font-size: calc(var(--content-font-size) * .86);
            color: var(--muted-color); margin-bottom: .7rem; padding-right: .8rem;
            border-right: 3px solid var(--gold); overflow-wrap: break-word;
        }
        .entry-content {
            font-family: 'Amiri', 'Traditional Arabic', 'Scheherazade New', serif;
            font-size: var(--content-font-size); text-align: justify; line-height: 2.4;
            white-space: pre-line; overflow-wrap: break-word;
        }

        .loading-state, .empty-state {
            text-align: center; padding: 3rem 1rem; font-family: 'Amiri', serif;
            font-size: 1.3rem; opacity: .75; color: var(--primary-color);
        }
        [data-theme="dark"] .loading-state, [data-theme="dark"] .empty-state { color: var(--gold); }

        .result-count { text-align: center; font-family: 'Cairo', sans-serif; font-size: .9rem; color: var(--muted-color); margin-bottom: 1rem; }
        .result-count.query { font-size: 1rem; font-weight: 700; color: var(--primary-color); }
        [data-theme="dark"] .result-count.query { color: var(--gold); }

        /* ===== التنبيه العائم ===== */
        .toast {
            position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(120%);
            background: var(--primary-color); color: #fff; padding: .8rem 1.4rem; border-radius: 30px;
            font-family: 'Cairo', sans-serif; font-weight: 700; font-size: .95rem; z-index: 999;
            box-shadow: 0 8px 24px rgba(0,0,0,.3); transition: transform .35s ease; max-width: 90vw;
        }
        [data-theme="dark"] .toast { color: #12100e; }
        .toast.show { transform: translateX(-50%) translateY(0); }

        footer { text-align: center; margin-top: 3rem; font-size: .9rem; opacity: .7; font-family: 'Amiri', serif; padding: 0 1rem; }
        footer .gold { color: var(--gold); }

        @media (max-width: 600px) {
            .entry-card { padding: 1.2rem; }
            header { padding: 2rem 1rem 1.6rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="ornament">﷽</div>
        <h1>سياق كرامات الأولياء</h1>
        <p class="subtitle">
            من كتاب <strong>شرح أصول اعتقاد أهل السنة والجماعة</strong> —
            للإمام <span class="author">أبي القاسم اللالكائي (ت 418 هـ)</span>
        </p>
    </header>

    <div class="container">
        <!-- لوحة البحث والأدوات -->
        <div class="controls-panel">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="ابحث بالعنوان أو النص أو اسم الراوي/الصحابي/التابعي أو رقم الأثر..." oninput="onSearch()" oncompositionend="onSearch()" onkeydown="if(event.key==='Escape'){clearSearch();}" autocomplete="off" aria-label="بحث في الآثار">
                <button class="search-clear" id="searchClear" type="button" onclick="clearSearch()" aria-label="مسح البحث" title="مسح البحث">✕</button>
            </div>
            <div class="fontsize-ctrl" title="حجم الخط">
                <button onclick="changeFontSize(-1)" aria-label="تصغير الخط">A−</button>
                <button onclick="changeFontSize(1)" aria-label="تكبير الخط">A+</button>
            </div>
            <button class="btn ghost" id="bookmarksBtn" onclick="toggleBookmarks()">⭐ المفضلة (<span id="bmCount">0</span>)</button>
            <button class="btn ghost" id="themeBtn" onclick="toggleTheme()" title="الوضع الليلي / النهاري">🌙</button>
        </div>

        <!-- صفوف التصفية (تُبنى تلقائياً من البيانات) -->
        <div class="filter-groups" id="filterGroups"></div>

        <div class="result-count" id="resultCount" aria-live="polite"></div>

        <!-- حاوية عرض الآثار -->
        <div id="entriesContainer">
            <div class="loading-state">جاري استدعاء أوراق الكتاب...</div>
        </div>
    </div>

    <footer>
        <p>أُعدّت بروح تراثية لإحياء ذخائر السلف الصالح <span class="gold">✦</span> الاستغناء عن الشبكة ممكن بعد أول زيارة</p>
    </footer>

    <div class="toast" id="toast"></div>

    <script>
        'use strict';
        if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

        /* ===== مفاتيح التخزين المحلي ===== */
        const BM_KEY = 'karamat_bookmarks';
        const THEME_KEY = 'karamat_theme';
        const FONT_KEY = 'karamat_fontsize';

        /* ===== حالة التطبيق ===== */
        let ALL = [];                 // كل الآثار
        let query = '';              // نص البحث الحالي
        let activeCat = '';          // الفئة المختارة
        let activeEra = '';          // الموطن/العصر المختار
        let showingBookmarks = false;
        let bookmarks = loadBookmarks();

        /* ===== أدوات مساعدة ===== */
        function esc(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // توحيد الحروف: التشكيل والهمزات والألف المقصورة — لبحث يتجاوز اختلاف الكتابة
        function normalizeArabic(text) {
            if (!text) return '';
            return String(text)
                .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '')
                .replace(/[أإآٱ]/g, 'ا')
                .replace(/ى/g, 'ي')
                .replace(/ؤ/g, 'و')
                .replace(/ئ/g, 'ي')
                .replace(/ة/g, 'ه')
                .toLowerCase();
        }

        function loadBookmarks() {
            try { return JSON.parse(localStorage.getItem(BM_KEY)) || []; } catch (e) { return []; }
        }
        function saveBookmarks() {
            try { localStorage.setItem(BM_KEY, JSON.stringify(bookmarks)); } catch (e) {}
            const el = document.getElementById('bmCount');
            if (el) el.innerText = bookmarks.length;
        }
        function isBookmarked(id) { return bookmarks.some(b => b.id === id); }

        /* ===== التنبيه العائم ===== */
        let toastTimer = null;
        function toast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
        }

        /* ===== تحميل البيانات ===== */
        async function initApp() {
            document.getElementById('bmCount').innerText = bookmarks.length;
            try {
                const res = await fetch('./data.json', { cache: 'no-cache' });
                if (!res.ok) throw new Error('data');
                ALL = await res.json();
                buildFilters();
                render();
            } catch (e) {
                document.getElementById('entriesContainer').innerHTML =
                    '<div class="empty-state">تعذّر تحميل ملف <b>data.json</b>. تأكد من وجوده بجانب الصفحة.</div>';
            }
        }

        /* ===== بناء صفوف التصفية من البيانات ===== */
        function distinct(field) {
            const seen = {};
            ALL.forEach(i => { if (i[field]) seen[i[field]] = (seen[i[field]] || 0) + 1; });
            return Object.keys(seen).map(k => ({ value: k, count: seen[k] }));
        }

        function buildFilters() {
            const groups = document.getElementById('filterGroups');
            groups.innerHTML = '';
            const cats = distinct('category');
            const eras = distinct('era');

            if (cats.length) groups.appendChild(makeFilterRow('الفئة', 'cat', cats));
            if (eras.length) groups.appendChild(makeFilterRow('الموطن/العصر', 'era', eras));
        }

        function makeFilterRow(label, kind, items) {
            const row = document.createElement('div');
            row.className = 'filter-row';
            const lab = document.createElement('span');
            lab.className = 'filter-label';
            lab.innerText = label + ':';
            row.appendChild(lab);

            const total = ALL.length;
            const allChip = document.createElement('button');
            allChip.className = 'chip';
            allChip.innerText = `الكل (${total})`;
            allChip.onclick = () => { setFilter(kind, ''); };
            row.appendChild(allChip);

            items.forEach(it => {
                const chip = document.createElement('button');
                chip.className = 'chip';
                chip.dataset.kind = kind;
                chip.dataset.value = it.value;
                chip.innerText = `${it.value} (${it.count})`;
                chip.onclick = () => { setFilter(kind, it.value); };
                row.appendChild(chip);
            });
            return row;
        }

        function setFilter(kind, value) {
            if (kind === 'cat') {
                activeCat = (activeCat === value) ? '' : value;
            } else {
                activeEra = (activeEra === value) ? '' : value;
            }
            showingBookmarks = false;
            document.getElementById('bookmarksBtn').classList.remove('active');
            syncChips();
            render();
        }

        function syncChips() {
            document.querySelectorAll('#filterGroups .chip').forEach(c => {
                const kind = c.dataset.kind;
                const val = c.dataset.value || '';
                if (!kind) { // زر "الكل"
                    const active = (activeCat === '' && activeEra === '');
                    c.classList.toggle('active', active);
                    return;
                }
                const cur = kind === 'cat' ? activeCat : activeEra;
                c.classList.toggle('active', cur === val);
            });
        }

        /* ===== البحث الفوري ===== */
        function onSearch() {
            const inp = document.getElementById('searchInput');
            query = inp.value.trim();
            const box = inp.closest('.search-box');
            if (box) box.classList.toggle('has-query', inp.value.length > 0);
            render();
        }
        function clearSearch() {
            const inp = document.getElementById('searchInput');
            inp.value = ''; query = '';
            const box = inp.closest('.search-box');
            if (box) box.classList.remove('has-query');
            render();
            inp.focus();
        }
        // إبراز الكلمة/الاسم المطابق — يتجاوز اختلاف التشكيل والهمزات
        let _hlCache = { q: null, re: null };
        function tolerantRegex(q) {
            const D = '[\\u064B-\\u065F\\u0670\\u06D6-\\u06ED]*';
            const parts = [...q].map((ch) => {
                let e = ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                e = e.replace(/[أإآٱا]/g, '[أإآٱا]').replace(/[ىي]/g, '[ىي]').replace(/ة/g, '[ةه]').replace(/[ؤئو]/g, '[ؤئوي]');
                return e + D;
            });
            return new RegExp('(' + parts.join('') + ')', 'g');
        }
        function highlight(text, q) {
            const safe = esc(text);
            if (!q) return safe;
            if (_hlCache.q !== q) {
                try { _hlCache.re = tolerantRegex(q); } catch (e) { _hlCache.re = null; }
                _hlCache.q = q;
            }
            if (!_hlCache.re) return safe;
            return safe.replace(_hlCache.re, '<mark>$1</mark>');
        }

        /* ===== اختيار المجموعة المعروضة ===== */
        function currentSet() {
            return showingBookmarks ? bookmarks : ALL;
        }

        function filtered() {
            let list = currentSet();
            if (showingBookmarks === false) {
                if (activeCat) list = list.filter(i => i.category === activeCat);
                if (activeEra) list = list.filter(i => i.era === activeEra);
            }
            const q = normalizeArabic(query);
            if (q) {
                list = list.filter(i =>
                    normalizeArabic(i.title).includes(q) ||
                    normalizeArabic(i.isnad).includes(q) ||
                    normalizeArabic(i.text).includes(q) ||
                    normalizeArabic(i.category).includes(q) ||
                    normalizeArabic(i.era).includes(q) ||
                    (i.source_num != null && String(i.source_num).includes(q))
                );
            }
            return list;
        }

        /* ===== العرض ===== */
        function render() {
            const container = document.getElementById('entriesContainer');
            const list = filtered();
            container.innerHTML = '';

            const rc = document.getElementById('resultCount');
            rc.className = 'result-count';
            if (showingBookmarks) rc.innerText = `المفضلة: ${list.length} أثر`;
            else if (query) { rc.className = 'result-count query'; rc.innerText = `نتائج البحث عن «${query}»: ${list.length} أثر من ${ALL.length}`; }
            else rc.innerText = `عدد الآثار المعروضة: ${list.length} من ${ALL.length}`;

            if (!list.length) {
                const p = document.createElement('div');
                p.className = 'empty-state';
                p.innerText = showingBookmarks ? 'لا توجد آثار في المفضلة بعد — انقر النجمة ☆ على أي أثر.' : 'لا توجد آثار مطابقة لبحثك.';
                container.appendChild(p);
                return;
            }

            list.forEach(item => container.appendChild(card(item)));
        }

        function card(item) {
            const el = document.createElement('article');
            el.className = 'entry-card';
            const saved = isBookmarked(item.id);
            const numBadge = item.source_num != null
                ? `<span class="entry-badge num">أثر رقم ${esc(item.source_num)}</span>` : '';
            const pending = item.verified === false
                ? `<span class="entry-badge pending" title="يُراجَع الإسناد والتوثيق في المطبوع">بانتظار التوثيق</span>` : '';
            el.innerHTML = `
                <div class="entry-header">
                    <h2 class="entry-title">${highlight(item.title, query)}</h2>
                    <div class="entry-actions">
                        <button class="icon-btn ${saved ? 'saved' : ''}" title="إضافة إلى المفضلة" aria-label="مفضلة"
                            onclick="toggleBookmark(${item.id})">${saved ? '★' : '☆'}</button>
                        <button class="icon-btn" title="نسخ / مشاركة الأثر" aria-label="مشاركة"
                            onclick="shareEntry(${item.id})">↗</button>
                    </div>
                </div>
                <div class="entry-badges">
                    ${item.category ? `<span class="entry-badge">${esc(item.category)}</span>` : ''}
                    ${item.era ? `<span class="entry-badge">${esc(item.era)}</span>` : ''}
                    ${numBadge}${pending}
                </div>
                ${item.isnad ? `<div class="entry-isnad">${highlight(item.isnad, query)}</div>` : ''}
                <div class="entry-content">${highlight(item.text, query)}</div>
            `;
            return el;
        }

        /* ===== المفضلة ===== */
        function findItem(id) {
            return ALL.find(i => i.id === id) || bookmarks.find(i => i.id === id) || null;
        }
        function toggleBookmark(id) {
            const item = findItem(id);
            if (!item) return;
            const idx = bookmarks.findIndex(b => b.id === id);
            if (idx >= 0) { bookmarks.splice(idx, 1); toast('أُزيل من المفضلة'); }
            else { bookmarks.push(item); toast('أُضيف إلى المفضلة'); }
            saveBookmarks();
            render();
        }
        function toggleBookmarks() {
            showingBookmarks = !showingBookmarks;
            if (showingBookmarks) { activeCat = ''; activeEra = ''; syncChips(); }
            document.getElementById('bookmarksBtn').classList.toggle('active', showingBookmarks);
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        /* ===== نسخ / مشاركة الأثر ===== */
        function shareEntry(id) {
            const it = findItem(id);
            if (!it) return;
            const ref = it.source_num != null ? `\n[المرجع: كرامات الأولياء للالكائي، أثر رقم ${it.source_num}]`
                : `\n[المرجع: كرامات الأولياء للالكائي]`;
            const payload = `${it.title}\n\n${it.isnad || ''}\n${it.text}${ref}\n\n— من تطبيق «سياق كرامات الأولياء»`;
            const nav = window.navigator;
            if (nav.share) {
                nav.share({ title: it.title, text: payload }).catch(() => copyText(payload));
            } else {
                copyText(payload);
            }
        }
        function copyText(txt) {
            const done = () => toast('نُسخ الأثر إلى الحافظة ✓');
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(txt).then(done).catch(() => fallbackCopy(txt, done));
            } else { fallbackCopy(txt, done); }
        }
        function fallbackCopy(txt, done) {
            try {
                const ta = document.createElement('textarea');
                ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta); ta.select();
                document.execCommand('copy'); document.body.removeChild(ta); done();
            } catch (e) { toast('تعذّرت المشاركة'); }
        }

        /* ===== المظهر وحجم الخط ===== */
        function applyTheme(t) {
            document.body.setAttribute('data-theme', t);
            document.documentElement.setAttribute('data-theme', t);
            const b = document.getElementById('themeBtn');
            if (b) b.innerText = t === 'dark' ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const next = document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            applyTheme(next);
            try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
        }
        function applyFontSize(rem) {
            document.documentElement.style.setProperty('--content-font-size', rem + 'rem');
        }
        function changeFontSize(dir) {
            let cur = 1.35;
            try { cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--content-font-size')) || 1.35; } catch (e) {}
            const next = Math.min(2.2, Math.max(1.0, Math.round((cur + dir * 0.15) * 100) / 100));
            applyFontSize(next);
            try { localStorage.setItem(FONT_KEY, String(next)); } catch (e) {}
        }

        /* ===== التهيئة ===== */
        (function boot() {
            let t = null;
            try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
            if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
            applyTheme(t);
            let fs = null;
            try { fs = localStorage.getItem(FONT_KEY); } catch (e) {}
            if (fs) applyFontSize(parseFloat(fs) || 1.35);
        })();

        initApp();
    </script>
    <script>
        // تسجيل Service Worker لتفعيل العمل دون إنترنت
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('./sw.js').catch(function () {});
            });
        }
    </script>
    <script data-root-sw="1">if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})})}</script>
</body>
</html>
